name: AniWatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install shell validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck busybox
      - name: Check POSIX shell syntax
        run: |
          set -eu
          find bin lib scripts tests -type f \( -name '*.sh' -o -path 'bin/aniwatch' \) -print |
          while IFS= read -r file; do
            sh -n "$file"
          done
      - name: Run ShellCheck
        run: |
          find bin lib scripts tests -type f \( -name '*.sh' -o -path 'bin/aniwatch' \) -print |
          xargs shellcheck -s sh
      - name: Run smoke tests
        run: make test
      - name: Test with dash
        run: TEST_SHELL=dash dash tests/run.sh
      - name: Test with BusyBox ash
        run: |
          ln -s "$(command -v busybox)" "$RUNNER_TEMP/ash"
          TEST_SHELL=ash PATH="$RUNNER_TEMP:$PATH" "$RUNNER_TEMP/ash" tests/run.sh
      - name: Build standalone command
        run: make build
      - name: Verify standalone help
        run: sh dist/aniwatch help
